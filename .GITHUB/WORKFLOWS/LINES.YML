name: Update CS2 lines
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch lines
        env:
          KASHROCK_API_KEY: ${{ secrets.KASHROCK_API_KEY }}
        run: python fetch_lines.py
      - name: Commit lines
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          if [ -f lines.json ]; then git add lines.json; fi
          git diff --staged --quiet || git commit -m "Update lines"
          git pull --rebase
          git push
