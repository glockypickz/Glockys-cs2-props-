name: Update CS2 lines
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  lines:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always start from the newest main. Without ref, a run that waited in the queue (or a Re-run) starts from the
      # older commit that triggered it, and its commit then collides with the data files pushed since.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Copies from before this run, so notify_push.py can tell what is new
      - name: Snapshot previous lines
        run: |
          cp lines.json /tmp/prev_lines.json 2>/dev/null || echo '{}' > /tmp/prev_lines.json
          cp lines_history.json /tmp/prev_history.json 2>/dev/null || echo '{}' > /tmp/prev_history.json
      # Players bo3.gg has no stats for, filled in from Cito (players_cito.json). Never fails the job.
      - name: Cito fallback players
        continue-on-error: true
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python cito_players.py
      - name: Fetch lines
        env:
          KASHROCK_API_KEY: ${{ secrets.KASHROCK_API_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python fetch_lines.py
      # Commit even if the fetch failed: fetch_lines.py marks the old file stale so the site can say so.
      - name: Cache player photos
        if: ${{ always() && !cancelled() }}
        continue-on-error: true
        run: python player_photos.py
      - name: Commit lines
        if: ${{ always() && !cancelled() }}
        env:
          KASHROCK_API_KEY: ${{ secrets.KASHROCK_API_KEY }}
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          stage() {
            if [ -f lines.json ]; then git add lines.json; fi
            if [ -f lines_history.json ]; then git add lines_history.json; fi
            if [ -f pregame.json ]; then git add pregame.json; fi
            if [ -f player_photos.json ]; then git add player_photos.json; fi
            if [ -f cito_odds.json ]; then git add cito_odds.json; fi
            if [ -f players_cito.json ]; then git add players_cito.json; fi
            if [ -d assets/players ]; then git add assets/players; fi
            git diff --staged --quiet || git commit -m "Update lines"
          }
          stage
          for attempt in 1 2 3; do
            if git pull --rebase; then
              if git push; then
                break
              fi
              echo "Push refused because main moved. Trying again ($attempt of 3)."
            else
              # Someone changed the same data files after this job started. Nothing is merged by hand: this run's copy is
              # thrown away and the fetch is done again on top of the newest main, so the history keeps everything.
              echo "Merge conflict in the data files. Redoing this run on the newest main ($attempt of 3)."
              git rebase --abort || true
              git reset --hard origin/main
              python cito_players.py || true
              python fetch_lines.py || true
              python player_photos.py || true
              stage
            fi
            if [ "$attempt" = 3 ]; then
              echo "Still could not push after 3 tries."
              exit 1
            fi
          done
      # Phone notifications to beta users (new lines / new grades). Skips if nothing is new or GP_ADMIN_KEY isn't set. Never fails the job.
      - name: Push notifications
        continue-on-error: true
        env:
          GP_ADMIN_KEY: ${{ secrets.GP_ADMIN_KEY }}
        run: python notify_push.py /tmp/prev_lines.json /tmp/prev_history.json
