name: Update CS2 results
on:
  schedule:
    - cron: "23 */5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: players-write
  cancel-in-progress: false
jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp
      - run: python update_results.py
      - name: Commit results
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add players.json
          git diff --staged --quiet || git commit -m "Update results"
          git pull --rebase
          git push

