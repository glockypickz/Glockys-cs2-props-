name: Update CS2 games
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  games:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp
      - run: python update_games.py
      - name: Commit games
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          if [ -f games.json ]; then git add games.json; fi
          git diff --staged --quiet || git commit -m "Update games"
          git pull --rebase
          git push
