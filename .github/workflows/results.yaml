name: Update CS2 results
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: players-write
  cancel-in-progress: false
jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install aiohttp
      # Finished matches from Cito (works when bo3.gg is blocked). Never fails the job.
      - name: Cito results
        continue-on-error: true
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python cito_results.py
      # bo3.gg results: a block here no longer stops the commit below.
      - name: bo3.gg results
        continue-on-error: true
        run: python update_results.py
      - name: Commit results
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add players.json
          git diff --staged --quiet || git commit -m "Update results"
          git pull --rebase
          git push
