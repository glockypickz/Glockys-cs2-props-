name: Debug CS2 lines
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ask KashRock what it has
        env:
          KASHROCK_API_KEY: ${{ secrets.KASHROCK_API_KEY }}
        run: python debug_lines.py
