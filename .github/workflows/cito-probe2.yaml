name: Cito probe 2
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe Cito CS2 (2)
        env:
          CITO_API_KEY: ${{ secrets.CITO_API_KEY }}
        run: python cito_probe2.py
