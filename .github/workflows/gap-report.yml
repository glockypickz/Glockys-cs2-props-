name: Gap report
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-commit
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the gap report
        run: python gap_report.py
      - name: Save the report
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add gap_report.json
          git diff --staged --quiet || git commit -m "Gap report"
          git pull --rebase
          git push

