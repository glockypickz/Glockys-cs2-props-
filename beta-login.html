<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a"><meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="/apple-touch-icon.png?v=2"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<title>Log in · Glockys Prop Grader</title>
<link rel="stylesheet" href="/beta.css"></head>
<body><div class="bw">
<div class="logo"><img src="/assets/logo-swing.png" alt="Glockys Prop Grader"></div>
<div class="tag">CS2 research tool · real bo3.gg stats · Maps 1-2 <span class="beta">BETA</span></div>
<div class="card">
 <div class="tabs"><button id="tLogin" class="on" type="button">Log in</button><button id="tSign" type="button">Sign up</button></div>
 <form id="fLogin" autocomplete="on">
  <label for="lu">Username or email</label><input id="lu" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="lp">Password</label><input id="lp" name="password" type="password" autocomplete="current-password" required>
  <button class="b" type="submit">Log in</button>
 </form>
 <form id="fSign" class="hide" autocomplete="on">
  <label for="si">Invite code</label><input id="si" name="invite" autocapitalize="characters" spellcheck="false" placeholder="From @GlockyPickz" required>
  <label for="su">Username</label><input id="su" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="24" required>
  <label for="se">Email</label><input id="se" name="email" type="email" autocomplete="email" required>
  <label for="sp">Password</label><input id="sp" name="password" type="password" autocomplete="new-password" minlength="8" placeholder="At least 8 characters" required>
  <button class="b" type="submit">Create account</button>
 </form>
 <div id="msg" class="msg"></div>
</div>
<div class="foot">The Grader is in private beta. Need an invite? DM <a href="https://x.com/GlockyPickz" target="_blank" rel="noopener">𝕏 @GlockyPickz</a></div>
</div>
<script src="/beta-login.js"></script></body></html>
